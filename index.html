<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


<style>
    .outer{

    border: 4px solid black;
    width: 2000px;
    height: 250px;
    display: flex;
    grid-template-columns: 100px 100px;
    grid-template-rows: 200px;
  }

  .common{

    border: 2px solid black;
    width: 300px;
    height: 150px;
    background-color: aquamarine;

  }

  .inner1{
     flex-basis:4 ;
  }
  .inner2{
    flex-shrink: 6px;
  }
  .inner3{
    flex-shrink:2px;
  }
    
</style>

    
</head>
<body>
    
    <div class="outer">

      
      <div class="inner1 common" ></div>
      <div class="inner2 common"></div>
      <div class="inner3 common"></div>



    </div>
</body>
</html>
